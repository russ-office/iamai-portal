<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MateOS · Пульс · Бэклог</title>
<link rel="stylesheet" href="../design-system/styles.css">
<link rel="stylesheet" href="./pulse.css">
</head>
<body>
<div id="app"></div>
<script src="./snapshot.js"></script>
<script src="./pulse.js"></script>
<script>
  // page-list archetype multiplexes several roles from one file via ?view=.
  var v = (new URLSearchParams(location.search).get("view") || "").toLowerCase();
  var MAP = { calendar: "calendar", leaderboard: "leaderboard", tasks: "tasks",
              library: "library", market: "marketplace", marketplace: "marketplace" };
  Pulse.mount(MAP[v] || "list");
</script>
</body>
</html>
